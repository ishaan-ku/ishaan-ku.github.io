<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishaan | Developer Portfolio</title>
    <meta name="description" content="Portfolio of Ishaan, a passionate developer.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="hero-section">
        <div class="container">
            <p class="greeting">Hello, world.</p>
            <h1 class="title">I'm <span class="gradient-text">Ishaan</span>.</h1>
            <p class="subtitle">Building the future, one commit at a time.</p>
            
            <div class="social-links">
                <a href="https://github.com/" target="_blank" id="github-profile-link" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:hello@example.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>

            <a href="#projects" class="cta-button">View Work</a>
        </div>
    </header>

    <main id="projects" class="projects-section">
        <div class="container">
            <h2 class="section-title">My Projects</h2>
            <div id="repo-grid" class="repo-grid">
                <!-- Projects will be loaded here dynamically -->
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> Ishaan. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
